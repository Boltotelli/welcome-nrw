function playerActionCard(name){
  const active=ownViolations().filter(v=>v.player_name===name&&activeViolation(v));
  const activeLevel=Math.min(active.length,4);
  const settled=ownSanctions().filter(s=>s.player_name===name&&Number(s.level)===activeLevel).sort((a,b)=>new Date(b.created_at||0)-new Date(a.created_at||0))[0];
  // A completed R1 action with a recorded time window needs no further action.
  // Keep any pending contacts and R1 actions missing a timer visible.
  if(activeLevel===2&&active.length&&active.every(v=>v.contacted)&&settled?.completed&&settled.started_at&&settled.end_at)return '';
  const count=violationCount(name),level=Math.min(count,4),warn=warningForPlayer(name),sanction=ownSanctions().find(s=>s.player_name===name&&s.level===level&&!s.completed);return `<article class="item"><div class="item-head"><div><div class="item-title">${esc(name)}</div><div class="item-meta">${t("activeCount",{n:count})}</div></div><span class="pill ${level>=3?"red":level===2?"orange":"blue"}">${t("action")} ${level}</span></div>${warn?`<div class="notice warn" style="margin-top:10px">⚠ ${t("repeatedWarning",{days:state.warningWindowDays})}</div>`:""}<div class="row" style="margin-top:10px"><span class="subtle">${t("action")}:</span><strong>${levelLabel(level)}</strong></div>${sanction?sanctionMini(sanction):""}</article>`}

    return `<div class="stack compact" data-sanction="${s.id}" style="margin-top:10px">
      ${s.started_at?`<div class="row"><span class="timer" data-timer="${esc(s.end_at||"")}">${remaining(s.end_at)}</span><span class="subtle">${s.end_at?`${t("until")} ${fmtDate(s.end_at)}`:""}</span></div>`:`<div class="notice warn">${t("measureNotStarted")}</div>`}

}

function renderPlayers(){
  const playerMap=new Map();
  ownPlayers().forEach(p=>playerMap.set(p.name||p.player_name,{name:p.name||p.player_name,game_id:p.game_id||""}));

<script>
(()=>{'use strict';
if(window.LEVEL3_APPLY_TIMER_UI_V1)return;
window.LEVEL3_APPLY_TIMER_UI_V1=true;

const baseOwnSanctionsL3=ownSanctions;
const baseRenderDashboardL3=renderDashboard;
const baseCompleteSanctionL3=completeSanction;
const baseGetPublicExclusionsL3=getPublicExclusions;
const baseEndManualExclusionL3=endManualExclusion;

function l3TimerRunning(s){
  return Number(s?.level)===3
    && !!s?.started_at
    && !!s?.end_at
    && new Date(s.end_at)>new Date();
}

// Existing dashboard code historically interprets completed=true as "ended".
// For an applied Level-3 exclusion completed=true now means "applied", so
// expose an active clone with completed=false only while Dashboard renders.
// Player Files still receive the real row and therefore keep the checkbox checked.
ownSanctions=function(){
  const rows=baseOwnSanctionsL3();
  if(!window.__l3DashboardRender)return rows;
  return rows.map(s=>l3TimerRunning(s)&&s.completed?{...s,completed:false}:s);
};

renderDashboard=function(){
  window.__l3DashboardRender=true;
  try{return baseRenderDashboardL3.apply(this,arguments)}
  finally{window.__l3DashboardRender=false}
};

completeSanction=async function(id,checked){
  const s=baseOwnSanctionsL3().find(x=>String(x.id)===String(id));
  if(!s||Number(s.level)!==3)return baseCompleteSanctionL3.apply(this,arguments);

  const before={completed:s.completed,completed_at:s.completed_at,started_at:s.started_at,end_at:s.end_at};
  s.completed=checked;

  // Optimistic display; the DB response below replaces these with exact server times.
  if(checked&&!s.started_at){
    const now=new Date();
    s.started_at=now.toISOString();
    s.end_at=new Date(now.getTime()+86400000).toISOString();
  }

  if(state.mode==='supabase'){
    const {data,error}=await sbClient.from('sanctions')
      .update({completed:checked})
      .eq('id',id)
      .select()
      .single();

    if(error){
      Object.assign(s,before);
      alert((typeof t==='function'?t('error'):'Error')+': '+(error.message||error));
      if(state.view==='players')renderPlayerDetail(s.player_name);else render();
      return;
    }
    if(data)Object.assign(s,data);
  }

  if(state.view==='players')renderPlayerDetail(s.player_name);
  else render();
};

getPublicExclusions=function(){
  if(state.mode==='supabase')return state.remotePublicExclusions||[];
  return ALLIANCES.flatMap(a=>(state.sanctions[a]||[])
    .filter(s=>[3,4].includes(Number(s.level))
      &&s.started_at
      &&(!s.end_at||new Date(s.end_at)>new Date())
      &&(Number(s.level)===3||!s.completed))
    .map(s=>({...s,alliance_code:a})));
};

// "End exclusion" remains a separate explicit action.
// For active Level 3 it shortens end_at to now; it does not reuse the
// "applied" checkbox meaning.
endManualExclusion=async function(id){
  const local=baseOwnSanctionsL3().find(x=>String(x.id)===String(id));
  const remote=(state.remotePublicExclusions||[]).find(x=>String(x.id)===String(id));
  const s=local||remote;
  if(!s||Number(s.level)!==3)return baseEndManualExclusionL3.apply(this,arguments);
  if(!confirm(t('endExclusionConfirm')))return;
  try{
    const now=new Date().toISOString();
    if(state.mode==='supabase'){
      const {error}=await sbClient.from('sanctions').update({end_at:now}).eq('id',id);
      if(error)throw error;
    }else if(local){
      local.end_at=now;
    }
    await refreshSharedNapData();
    renderNap();
  }catch(err){
    alert(t('error')+': '+(err?.message||err));
  }
};
})();
</script></body>

<script>
(()=>{'use strict';
if(window.PLAYER_LANGUAGE_EDITOR_V2)return;window.PLAYER_LANGUAGE_EDITOR_V2=true;
const PLE={
 de:{edit:'Sprachen bearbeiten',add:'Hinzufügen',save:'Speichern',cancel:'Abbrechen',saved:'Sprachen gespeichert.',empty:'Noch keine Sprache hinterlegt',choose:'Sprache auswählen',remove:'Entfernen'},
 en:{edit:'Edit languages',add:'Add',save:'Save',cancel:'Cancel',saved:'Languages saved.',empty:'No language added yet',choose:'Choose language',remove:'Remove'},
 es:{edit:'Editar idiomas',add:'Añadir',save:'Guardar',cancel:'Cancelar',saved:'Idiomas guardados.',empty:'Aún no hay idiomas registrados',choose:'Elegir idioma',remove:'Eliminar'},
 fr:{edit:'Modifier les langues',add:'Ajouter',save:'Enregistrer',cancel:'Annuler',saved:'Langues enregistrées.',empty:'Aucune langue enregistrée',choose:'Choisir une langue',remove:'Supprimer'}
};
const plet=k=>(PLE[state?.lang]||PLE.en)[k]||k;
const PLE_LANGS=[
 ['de','Deutsch'],['en','English'],['fr','Français'],['es','Español'],['tr','Türkçe'],
 ['it','Italiano'],['pt','Português'],['pl','Polski'],['nl','Nederlands'],['sv','Svenska'],
 ['no','Norsk'],['da','Dansk'],['fi','Suomi'],['cs','Čeština'],['hu','Magyar'],
 ['ro','Română'],['bg','Български'],['ru','Русский'],['uk','Українська'],['ar','العربية'],
 ['fa','فارسی (Farsi)'],['he','עברית'],['zh','中文'],['ja','日本語'],['ko','한국어'],
 ['id','Bahasa Indonesia'],['ms','Bahasa Melayu'],['vi','Tiếng Việt'],['th','ไทย'],['duck','Duck']
];
const pleName=c=>(PLE_LANGS.find(x=>x[0]===String(c).toLowerCase())?.[1]||String(c));
function pleNormalize(a){return [...new Set((Array.isArray(a)?a:[]).map(x=>String(x).trim().toLowerCase()).filter(Boolean))]}
function plePaintDisplay(box,codes){
 const vals=box.querySelector('.player-language-values');if(!vals)return;
 vals.innerHTML=codes.length?codes.map(c=>'<span class="pill blue">'+esc(pleName(c))+'</span>').join(''):'<span class="muted">'+esc(plet('empty'))+'</span>';
}
function pleEnhance(name){
 if(state?.view!=='players')return;
 const box=document.querySelector('#playerLanguagesCard');if(!box||box.dataset.editorReady==='1')return;
 const player=(ownPlayers?.()||[]).find(p=>(p.name||p.player_name)===name&&p.id);if(!player)return;
 box.dataset.editorReady='1';box.dataset.playerId=player.id;
 let current=pleNormalize(player.languages),working=[...current];
 plePaintDisplay(box,current);
 const actions=document.createElement('div');actions.className='player-language-edit-actions';
 const edit=document.createElement('button');edit.type='button';edit.className='ghost small';edit.textContent='✎ '+plet('edit');actions.appendChild(edit);
 const status=document.createElement('span');status.className='subtle player-language-save-status';actions.appendChild(status);box.appendChild(actions);
 const editor=document.createElement('div');editor.className='player-language-editor hidden';
 editor.innerHTML='<div class="player-language-editor-chips"></div><div class="player-language-add-row"><select class="player-language-select"><option value="">'+esc(plet('choose'))+'</option>'+PLE_LANGS.map(x=>'<option value="'+esc(x[0])+'">'+esc(x[1])+'</option>').join('')+'</select><button type="button" class="secondary small player-language-add">'+esc(plet('add'))+'</button></div><div class="actions"><button type="button" class="primary small player-language-save">'+esc(plet('save'))+'</button><button type="button" class="ghost small player-language-cancel">'+esc(plet('cancel'))+'</button></div>';
 box.appendChild(editor);
 const chips=editor.querySelector('.player-language-editor-chips'),select=editor.querySelector('.player-language-select');
 function draw(){
   chips.innerHTML=working.length?working.map(c=>'<button type="button" class="pill blue player-language-remove" data-code="'+esc(c)+'" title="'+esc(plet('remove'))+'">'+esc(pleName(c))+' ×</button>').join(''):'<span class="muted">'+esc(plet('empty'))+'</span>';
   chips.querySelectorAll('.player-language-remove').forEach(b=>b.onclick=()=>{working=working.filter(x=>x!==b.dataset.code);draw()});
 }
 edit.onclick=()=>{working=[...current];draw();editor.classList.toggle('hidden');status.textContent=''};
 editor.querySelector('.player-language-add').onclick=()=>{const c=select.value;if(c&&!working.includes(c)){working.push(c);draw()}select.value=''};
 editor.querySelector('.player-language-cancel').onclick=()=>{working=[...current];editor.classList.add('hidden');status.textContent=''};
 editor.querySelector('.player-language-save').onclick=async e=>{
   const btn=e.currentTarget;btn.disabled=true;status.textContent='…';
   try{
     const {data,error}=await sbClient.from('players').update({languages:working}).eq('id',player.id).select('*').single();
     if(error)throw error;
     current=pleNormalize(data?.languages||working);working=[...current];
     const idx=(state.players[state.alliance]||[]).findIndex(p=>String(p.id)===String(player.id));
     if(idx>=0)state.players[state.alliance][idx]={...state.players[state.alliance][idx],...(data||{}),languages:[...current]};
     plePaintDisplay(box,current);editor.classList.add('hidden');status.textContent=plet('saved');status.className='success player-language-save-status';
   }catch(err){status.textContent=err?.message||String(err);status.className='error player-language-save-status'}
   finally{btn.disabled=false}
 };
}
const pleBase=renderPlayerDetail;
renderPlayerDetail=function(name){const r=pleBase(name);setTimeout(()=>pleEnhance(name),90);setTimeout(()=>pleEnhance(name),280);return r};
const pleObs=new MutationObserver(()=>{if(state?.view==='players'){const title=document.querySelector('#content section.stack .row h3');if(title)setTimeout(()=>pleEnhance(title.textContent.trim()),40)}});
pleObs.observe(document.querySelector('#content')||document.documentElement,{childList:true,subtree:true});
const css=document.createElement('style');css.textContent='.player-language-edit-actions{grid-column:1/-1;display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:4px}.player-language-editor{grid-column:1/-1;display:grid;gap:9px;padding-top:8px;border-top:1px solid var(--border)}.player-language-editor-chips{display:flex;gap:6px;flex-wrap:wrap}.player-language-remove{border:1px solid rgba(107,167,216,.38);cursor:pointer}.player-language-add-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}.player-language-add-row select{min-height:38px}.player-language-save-status{font-size:11px}@media(max-width:520px){.player-language-add-row{grid-template-columns:1fr}}';document.head.appendChild(css);
})();
</script>
